function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('primary',b.id==='t-'+screen));if(screen==='roster'){el.innerHTML=`<h2>Состав смены</h2><p class="muted">Отметьте, кто вышел на работу. Бригадир входит в состав пяти формовщиков.</p><div class="card">${staff.map((s,i)=>`<label class="row"><span>Формовщик № ${i+1}${i===0?' · бригадир':''}</span><input class="check" type="checkbox" ${s?'checked':''} onchange="staff[${i}]=this.checked;approved=false;render()"></label>`).join('')}</div><div class="grid"><div class="metric">Вышли<b>${staff.filter(Boolean).length} чел.</b></div><div class="metric">Полезный фонд<b>${Math.floor(staff.filter(Boolean).length*620/60)} ч ${staff.filter(Boolean).length*620%60} мин</b></div></div><div class="notice">Смена 07:00–19:00, обед 12:00–13:00. Технический отдых 40 минут на человека учтён в фонде, но отдельно не назначается.</div><div class="actions"><button class="primary" onclick="tab('plan')">Выбрать проекты →</button><button onclick="preset()">Загрузить учебный пример</button></div>`}
else if(screen==='plan'){el.innerHTML=`<h2>Выбор проектов и деталей</h2><p class="muted">Выбирайте только нужные детали. Порядок проектов задаёт начальник цеха.</p><div class="card"><h3>Очередность проектов</h3>${priority.length?priority.map((p,i)=>`<div class="project"><b>${i+1}. ${esc(p)}</b><span><button class="small" onclick="move('${p}',-1)">↑</button> <button class="small" onclick="move('${p}',1)">↓</button></span></div>`).join(''):'<span class="muted">Проекты ещё не выбраны</span>'}</div>${PROJECTS.map(p=>{let xs=CATALOG.filter(x=>x.project===p),cnt=xs.filter(x=>selected[x.id]).length;return `<div class="card"><div class="row"><h3>${esc(p)}</h3><span class="pill">${cnt} из ${xs.length}</span></div><div class="actions"><button class="small primary" onclick="selectProject('${p}',true)">Весь комплект</button><button class="small" onclick="selectProject('${p}',false)">Очистить</button><button class="small" onclick="addProject('${p}')">В очередь</button></div><details><summary style="padding:12px 0;cursor:pointer">Выбрать отдельные детали</summary>${xs.map(x=>`<div class="item"><div class="row"><div><b>№${x.id} · ${esc(x.name)}</b><div class="tag">Матрица ${esc(x.matrix)} · ${x.minutes} чел.-мин · смола ${resin(x)}</div></div><div class="qty"><button class="small" onclick="setQty(${x.id},${(selected[x.id]||0)-1})">−</button><b>${selected[x.id]||0}</b><button class="small" onclick="setQty(${x.id},${(selected[x.id]||0)+1})">+</button></div></div></div>`).join('')}</details></div>`}).join('')}<div class="card row"><div><b>${Object.values(selected).reduce((a,b)=>a+b,0)} деталей</b><div class="muted">${staff.filter(Boolean).length} формовщиков</div></div><button class="primary" onclick="calc()">Рассчитать →</button></div>`}
else if(screen==='chief'){let ins=tasks.filter(t=>t.start!==null),out=tasks.filter(t=>t.start===null);el.innerHTML=`<h2>Проверка начальником цеха</h2>${tasks.length?'':`<div class="notice">Сначала выберите проекты и нажмите «Рассчитать».</div>`}<div class="grid"><div class="metric">В смене<b>${ins.length}</b></div><div class="metric">Остаток<b>${out.length}</b></div><div class="metric">Последнее окончание<b>${ins.length?fmt(Math.max(...ins.map(t=>t.end))):'—'}</b></div><div class="metric">Смола по нормам<b>${ins.some(t=>t.resin!=null)?ins.reduce((s,t)=>s+(t.resin||0),0).toFixed(2)+' кг':'—'}</b></div></div><div class="notice">Это учебный упрощённый расчёт, а не проверенный промышленный оптимизатор. Для деталей без норм смолы потребность неполная; условные номера матриц нужно заменить фактическими.</div><div class="card"><h3>Назначенные работы</h3><div class="scroll">${ins.map(t=>`<div class="item"><b>№${t.id} ${esc(t.name)}</b><div class="details">${esc(t.project)} · матрица ${esc(t.matrix)} · ${t.people.join(', ')} · ${fmt(t.start)}–${fmt(t.end)}</div><div class="muted">Смола ${resin(t)}</div></div>`).join('')||'Нет назначений'}</div></div>${out.length?`<div class="card"><h3>На следующую смену</h3>${out.map(t=>`<div class="item">№${t.id} · ${esc(t.name)}</div>`).join('')}</div>`:''}<div class="actions"><button onclick="tab('plan')">← Изменить план</button><button class="green" onclick="approve()" ${ins.length?'':'disabled'}>Утвердить учебное задание →</button></div>`}
else{let ins=tasks.filter(t=>t.start!==null),done=ins.filter(t=>t.status==='готово').length;el.innerHTML=`<h2>Рабочее место бригадира</h2>${approved?'':`<div class="notice">Это демонстрация. Сначала рассчитайте и утвердите учебный план на вкладке «Проверка».</div>`}<div class="card"><div class="row"><div><div class="muted">Учебное время</div><div class="big">${fmt(clock)}</div></div><span class="pill">Готово ${done} / ${ins.length}</span></div><div class="actions"><button class="small" onclick="advance(10)">+10 мин</button><button class="small" onclick="advance(30)">+30 мин</button><button class="small" onclick="advance(60)">+1 час</button><button class="small" onclick="advance(0)">Обновить</button></div></div><div class="card"><h3>Задания</h3>${ins.length?ins.map(t=>`<div class="item"><div class="row"><b>№${t.id} · ${esc(t.name)}</b><span class="pill">${t.status}</span></div><div class="details">Матрица ${esc(t.matrix)} · формовщики №${t.people.join(', №')} · план ${fmt(t.start)}–${fmt(t.end)}</div><div class="muted">Смола: ${resin(t)} на изделие · рекомендуемая порция не более 3 кг</div><div class="actions">${t.status==='ожидает'?`<button class="primary small" onclick="start('${t.tid}')">Начать</button>`:''}${t.status==='в работе'?`<button class="green small" onclick="finish('${t.tid}',false)">Осмотрено · готово</button><button class="red small" onclick="finish('${t.tid}',true)">Дефект</button>`:''}${t.status==='исправление'?`<button class="small" onclick="resume('${t.tid}')">Исправлено · повторный осмотр</button>`:''}${t.status==='готово'?`<span class="status">✓ Завершено в ${fmt(t.actualEnd)}</span>`:''}</div></div>`).join(''):'<div class="muted">Нет учебного плана</div>'}</div><div class="actions"><button onclick="tab('chief')">← К плану</button><button class="outline" onclick="reset()">Новый учебный прогон</button></div>`} }
render();</script></body></html>
